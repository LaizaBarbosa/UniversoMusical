<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de Cliente </title>
<link rel="stylesheet" href="./estilo.css">
</head>
<body>
<header>
<div class="container topo">
<h1>Cliente</h1>
<nav aria-label="Principal">
<ul>
<li><a href="./index.html">Home</a></li>
</ul>
</nav>
</div>
</header>


<main class="container">
<section>
<div class="caixa">
<h2>Cadastro de Cliente</h2>
<form class="form" action="#" method="post" autocomplete="on">


<div class="form-grid-2">
<div>
<label for="nome">Nome completo *</label>
<input id="nome" name="nome" type="text" placeholder="Ex.: Maria Silva" required>
</div>


<div>
<label for="email">Email *</label>
<input id="email" name="email" type="email" placeholder="nome@dominio.com" required>
</div>


<div>
<label for="senha">Senha *</label>
<input id="senha" name="senha" type="password" minlength="6" placeholder="Mínimo 6 caracteres" required>
</div>


<div>
<label for="nascimento">Data de nascimento *</label>
<input id="nascimento" name="nascimento" type="date" required>
</div>


<div>
<label for="telefone">Telefone</label>
<input id="telefone" name="telefone" type="tel" placeholder="(11) 90000-0000">
</div>


<div>
<label for="estado">Estado *</label>
<select id="estado" name="estado" required>
<option value="">Selecione...</option>
<option>AC</option>
<option>AL</option>
<option>AP</option>
<option>AM</option>
<option>BA</option>
<option>CE</option>
<option>DF</option>
<option>ES</option>
<option>GO</option>
<option>MA</option>
<option>MT</option>
<option>MS</option>
<option>MG</option>
<option>PA</option>
<option>PB</option>
<option>PR</option>
<option>PE</option>
<option>PI</option>
<option>RJ</option>
<option>RN</option>
<option>RS</option>
<option>RO</option>
<option>RR</option>
<option>SC</option>
<option>SP</option>
<option>SE</option>
<option>TO</option>
</select>
</div>
</div>


<div>
<label for="endereco">Endereço</label>
<input id="endereco" name="endereco" type="text" placeholder="Rua, nº, complemento">
</div>

<p>
<button type="submit">Salvar</button>
<button class="btn sec" type="reset">Limpar</button>
<a class="btn" href="cadastro.html">Voltar</a>
</p>
</form>
</div>
</section>
</main>


<footer>
<div class="container">© 2025 Site Básico</div>
</footer>
</body>
</html>
