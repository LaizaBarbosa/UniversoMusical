<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de novo instrumento</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <section>
        <!-- atualizar o formulario -->
        <h1>Cadastre um novo instrumento</h1>
        <form action="post">
            <div>
                <label for="nomeInstrumento">Nome: </label>
                <input type="text" id="nomeInstrumento">
            </div>
        
            <div>
                <label for="tipoInstrumento">Tipo: </label>
                <select name="tipo de instrumento" id="tipoInstrumento">
                    <option value="audGrav">Aúdio e gravação</option>
                    <option value="batEperc">Bateria e percussão</option>
                    <option value="corda">Instrumento de corda</option>
                    <option value="sopro">Instrumento de sopro</option>
                    <option value="tecla">Instrumento de teclas</option>
                </select>
            </div>

            <div>
                <label for="preco">Preço: </label>
                <input type="number" id="preco" placeholder="R$0,00" step="0.01" min="1" max="20000">
            </div>
        </form>
    </section>
<script src="../../dist/main.js"></script>
</body>
</html>
